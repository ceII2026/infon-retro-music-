<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>INFON Retro Archive</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e9e9e9;
}

/* 🌈 шапка с градиентом */
header {
  background: linear-gradient(90deg, #ff512f, #dd2476);
  color: white;
  text-align: center;
  padding: 20px;
}

/* 📱 меню */
nav {
  background: #222;
  text-align: center;
}

nav a {
  display: inline-block;
  padding: 12px 18px;
  color: white;
  text-decoration: none;
}

nav a:hover {
  background: #ff512f;
}

/* 🎵 блоки мелодий */
.container {
  padding: 20px;
}

.song {
  background: white;
  margin-bottom: 10px;
  padding: 12px;
  border-radius: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* 🔘 кнопки */
button {
  padding: 8px 12px;
  border: none;
  background: #ff512f;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #dd2476;
}

/* 📦 футер */
footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 10px;
  margin-top: 20px;
}

/* 🪟 модальное окно */
.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
}

.modal-box {
  background: white;
  width: 260px;
  margin: 20% auto;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
</style>

</head>

<body>

<header>
  <h1>INFON Retro Archive</h1>
  <p>Мелодии старого мобильного интернета</p>
</header>

<nav>
  <a href="#songs">Мелодии</a>
  <a href="#archive">Архив</a>
  <a href="#about">О проекте</a>
</nav>

<div class="container">

  <h2 id="songs">🔥 Популярные мелодии</h2>

  <div class="song">
    <p>Лесник — Король и Шут</p>
    <button onclick="openModal()">Скачать</button>
  </div>

  <div class="song">
    <p>Мелодия Nokia Classic</p>
    <button onclick="openModal()">Скачать</button>
  </div>

</div>

<footer>
  © 2026 INFON Retro Archive — фан-проект в стиле 2000-х
</footer>

<!-- 🪟 окно -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Выберите формат</h3>

    <button onclick="download('mp3')">MP3</button>
    <button onclick="download('mmf')">MMF</button>
    <button onclick="download('midi')">MIDI</button>

    <br><br>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function download(format) {
  alert("Скачивание: " + format);
  closeModal();
}
</script>

</body>
</html>

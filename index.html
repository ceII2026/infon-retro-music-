<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFON Retro Music</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #090979 0%, #020024 100%);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .background-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 50px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo { display: flex; align-items: center; gap: 16px; }

    .logo-icon { font-size: 34px; }

    .logo h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 26px;
      color: #ffe600;
    }

    nav a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
    }

    .hero {
      padding: 100px 20px 60px;
      text-align: center;
    }

    .hero h2 { font-size: 50px; }

    .hero span { color: #ffe600; }

    .buttons { margin-top: 30px; }

    .btn {
      padding: 14px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .btn-primary { background: #ffe600; }
    .btn-secondary { background: rgba(255,255,255,0.2); color: white; }

    .songs {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    .section-title {
      text-align: center;
      font-size: 30px;
      margin-bottom: 20px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 20px;
    }

    .download-btn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      background: #00d9ff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 30px;
      opacity: 0.7;
    }

    /* 🪟 окно */
    .modal {
      display: none;
      position: fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background: rgba(0,0,0,0.6);
    }

    .modal-box {
      background: white;
      color: black;
      width: 260px;
      margin: 20% auto;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    .modal-box button {
      margin: 5px;
      padding: 8px 12px;
    }
  </style>
</head>

<body>

<div class="background-grid"></div>

<header>
  <div class="logo">
    <div class="logo-icon">📱</div>
    <h1>INFON RETRO</h1>
  </div>

  <nav>
    <a href="#songs">Мелодии</a>
    <a href="#about">О проекте</a>
  </nav>
</header>

<section class="hero">
  <h2>Мобильный <span>ретро-шарм</span></h2>
</section>

<section class="songs" id="songs">
  <h2 class="section-title">Популярные мелодии</h2>

  <div class="song-grid">

    <div class="song-card">
      <h3>Черный Бумер</h3>
      <button class="download-btn" onclick="openModal()">Скачать</button>
    </div>

    <div class="song-card">
      <h3>Crazy Frog</h3>
      <button class="download-btn" onclick="openModal()">Скачать</button>
    </div>

    <div class="song-card">
      <h3>Dragostea Din Tei</h3>
      <button class="download-btn" onclick="openModal()">Скачать</button>
    </div>

  </div>
</section>

<section id="about">
  <h2 class="section-title">О проекте</h2>
  <p style="text-align:center; max-width:800px; margin:auto;">
    INFON Retro Archive — архив мелодий 2000-х.
  </p>
</section>

<footer>
  © 2026 INFON Retro Archive
</footer>

<!-- 🪟 модальное окно -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Выберите формат</h3>

    <button onclick="download('mp3')">MP3</button>
    <button onclick="download('mmf')">MMF</button>
    <button onclick="download('midi')">MIDI</button>

    <br><br>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function download(format) {
  let a = document.createElement("a");
  a.href = "files/music." + format;
  a.download = "music." + format;
  a.click();

  closeModal();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>INFON Retro Archive</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
}

/* кнопка */
button {
  padding: 8px 12px;
  margin: 5px;
  cursor: pointer;
}

/* модальное окно */
.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.7);
}

.modal-box {
  background: #fff;
  color: #000;
  width: 260px;
  margin: 20% auto;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
</style>

</head>

<body>

<h1>INFON Retro Archive</h1>

<!-- пример мелодии -->
<div class="song">
  <p>Популярная мелодия #1</p>
  <button onclick="openModal()">Скачать</button>
</div>

<footer>
  © 2026 INFON Retro Archive — фан-проект в стиле мобильного интернета 2000-х
</footer>

<!-- 🔽 МОДАЛЬНОЕ ОКНО -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Выберите формат</h3>

    <button onclick="download('mp3')">MP3</button>
    <button onclick="download('mmf')">MMF</button>
    <button onclick="download('midi')">MIDI</button>

    <br><br>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<!-- ⚙️ СКРИПТ -->
<script>
function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function download(format) {
  alert("Скачивание в формате: " + format);

  // пример файла (поменяешь потом на свои)
  let link = document.createElement("a");
  link.href = "files/music." + format;
  link.download = "music." + format;
  link.click();

  closeModal();
}
</script>

</body>
</html>

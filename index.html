<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>INFON Retro Archive</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  margin: 0;
  color: #222;
}

/* шапка */
header {
  background: #1a1a1a;
  color: white;
  padding: 15px;
  text-align: center;
}

/* меню */
nav {
  background: #333;
  text-align: center;
}

nav a {
  display: inline-block;
  color: white;
  padding: 10px 15px;
  text-decoration: none;
}

nav a:hover {
  background: #555;
}

/* блок мелодий */
.container {
  padding: 20px;
}

.song {
  background: white;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
}

/* футер */
footer {
  background: #1a1a1a;
  color: white;
  text-align: center;
  padding: 10px;
  margin-top: 20px;
}

/* модалка (пока скрыта) */
.modal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
}

.modal-box {
  background: white;
  width: 250px;
  margin: 20% auto;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
</style>

</head>

<body>

<header>
  <h1>INFON Retro Archive</h1>
</header>

<nav>
  <a href="#songs">Мелодии</a>
  <a href="#archive">Архив</a>
  <a href="#about">О проекте</a>
</nav>

<div class="container">

  <h2 id="songs">Популярные мелодии</h2>

  <div class="song">
    <p>Мелодия 1</p>
    <button onclick="openModal()">Скачать</button>
  </div>

  <div class="song">
    <p>Мелодия 2</p>
    <button onclick="openModal()">Скачать</button>
  </div>

</div>

<footer>
  © 2026 INFON Retro Archive — фан-проект в стиле мобильного интернета 2000-х
</footer>

<!-- модальное окно -->
<div id="modal" class="modal">
  <div class="modal-box">
    <h3>Выберите формат</h3>

    <button onclick="download('mp3')">MP3</button>
    <button onclick="download('mmf')">MMF</button>
    <button onclick="download('midi')">MIDI</button>

    <br><br>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("modal").style.display = "block";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function download(format) {
  alert("Скачивание: " + format);
  closeModal();
}
</script>

</body>
</html>
